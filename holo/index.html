<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>JB Holo</title>
<meta name="description" content="A Jerome Baker holo sticker you can grab, twist and crumple. Add it to your home screen, or run it as a wallpaper.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JB Holo">
<link rel="manifest" href="holo.webmanifest">
<link rel="icon" href="../assets/icons/holo-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../assets/icons/holo-apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c12;--ink:#0A0A0A;--yel:#FFF100;--red:#DA2342}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:#fff;font:700 14px/1.3 Montserrat,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0}
html.clear,html.clear body{background:transparent}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab;touch-action:none}
#stage canvas:active{cursor:grabbing}
#still{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px;text-align:center}
#still img{max-width:min(80vw,560px);max-height:62vh;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.35))}
#still.on{display:flex}
.hint{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top));translate:-50% 0;margin:0;padding:8px 14px;background:var(--ink);color:var(--yel);font-weight:800;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .6s;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.hint.gone{opacity:0}
#ui{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.55) 40%);transition:opacity .5s,translate .5s}
#ui.dim{opacity:.0;translate:0 30px;pointer-events:none}
#ui[hidden]{display:none}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:58px;height:58px;padding:4px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.strip button img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.strip button.on{background:var(--yel);outline:3px solid var(--yel);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row button,.chip{min-height:44px;padding:0 14px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:800 14px Montserrat,Helvetica,Arial,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.row button.go{background:var(--red);color:#fff;border-color:var(--yel)}
.row button[disabled]{opacity:.6;cursor:wait}
.sw{display:flex;gap:6px;margin-left:auto}
.sw button{width:36px;min-height:36px;height:36px;padding:0;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.sw button.on{outline:3px solid var(--yel);outline-offset:2px}
.sw .tr{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/12px 12px}
#more{position:absolute;z-index:6;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:44px;height:44px;border:3px solid var(--ink);background:var(--yel);color:var(--ink);font:900 20px/1 Montserrat,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .5s}
#more.on{opacity:.55;pointer-events:auto}
#more:hover{opacity:1}
.toast{position:absolute;left:50%;top:50%;translate:-50% -50%;margin:0;padding:12px 18px;background:var(--red);color:#fff;border:3px solid var(--yel);font-weight:900;font-size:16px;box-shadow:4px 4px 0 var(--ink);pointer-events:none}
.toast[hidden]{display:none}
.rec{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--ink);color:#fff;font-weight:800}
.rec::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.rec.on{display:flex}
@keyframes blink{50%{opacity:.2}}
@media (min-width:760px){#ui{flex-direction:row;align-items:center;justify-content:space-between}.strip{flex:1;min-width:0}}
</style>
</head>
<body>
<div id="stage" aria-label="Holo sticker. Drag it to twist, double-tap to crumple."></div>
<div id="still" role="img"><img alt=""><p></p><button type="button" class="chip" id="anyway" hidden>Turn it on anyway</button></div>
<p class="hint" id="hint">Grab it to twist. Double-tap to crumple.</p>
<p class="rec" id="rec">Recording</p>
<p class="toast" id="toast" hidden></p>
<div id="ui">
  <div class="strip" id="strip" role="listbox" aria-label="Pick a sticker"></div>
  <div class="row">
    <button type="button" class="go" id="loop">Save a loop</button>
    <button type="button" id="png">Save PNG</button>
    <button type="button" id="fs">Full screen</button>
    <button type="button" id="hide" aria-label="Hide the controls">Hide</button>
    <div class="sw" id="sw" aria-label="Background"></div>
  </div>
</div>
<button type="button" id="more" aria-label="Show the controls">•••</button>
<script src="../js/perf.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
