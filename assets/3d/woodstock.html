<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodstock (Original), 3D test</title>
<style>
:root{--bg-top:#f4f4f6;--bg-bottom:#cfd0d6;--text:#1d1d22;--muted:#5d5d66}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg-top:#3a3a40;--bg-bottom:#141418;--text:#ececf0;--muted:#a3a3ad}}
:root[data-theme="dark"]{--bg-top:#3a3a40;--bg-bottom:#141418;--text:#ececf0;--muted:#a3a3ad}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg-bottom);background-image:radial-gradient(ellipse at 50% 35%,var(--bg-top) 0%,var(--bg-bottom) 80%);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:absolute;top:0;left:0;right:0;padding:14px 16px 0;text-align:center;pointer-events:none;z-index:2}
h1{margin:0;font-size:1.15rem;font-weight:650}
p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.16);z-index:3;max-width:calc(100vw - 24px)}
.bar button{font:600 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border:0;border-radius:999px;background:#fff;color:#1d1d22;min-width:44px;height:44px;padding:0 14px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);white-space:nowrap}
.bar button.ic{padding:0;font-size:20px}
.bar button.on{background:#233671;color:#fff;box-shadow:none}
.bar .sep{width:1px;height:26px;background:rgba(0,0,0,.14);margin:0 2px}
@media (max-width:420px){.bar{gap:4px;padding:5px}.bar button{padding:0 10px;font-size:13px;height:42px}.bar button.ic{min-width:40px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar{background:rgba(30,30,36,.82)}:root:not([data-theme="light"]) .bar button{background:#2b2b33;color:#ececf0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}:root:not([data-theme="light"]) .bar button.on{background:#FCD804;color:#111}:root:not([data-theme="light"]) .bar .sep{background:rgba(255,255,255,.18)}}
</style>

  flyTo(controls.target.clone().add(dir.multiplyScalar(d)), controls.target.clone(), 450);
}
const bar = document.querySelector('.bar');
function setOn(b) { bar.querySelectorAll('[data-spot]').forEach((x) => x.classList.toggle('on', x === b)); }
const home = () => { fitHome(); flyTo(HOME.pos, HOME.tgt); setOn(null); };

// --- detail spots
scene.updateMatrixWorld(true);
const mc = MARB.reduce((a, v) => a.add(v), new THREE.Vector3()).divideScalar(Math.max(1, MARB.length));
const mOut = new THREE.Vector3(mc.x, 0, mc.z).normalize();
const span = MARB.length ? Math.max(...MARB.map((v) => v.y)) - Math.min(...MARB.map((v) => v.y)) : 0;
const SPOTS = {
  marbles: () => C.focus ? closeOn(new THREE.Vector3(C.focus[2], Y(C.focus[0]), 0), fit(Math.max(7, C.focus[1] * H * 1.3), Math.max(8, C.focus[1] * H * 1.7)), new THREE.Vector3(Math.sign(C.focus[2]) * 0.35, 0.12, 1).normalize()) : SPOTS.crown(),
  crown: () => closeOn(new THREE.Vector3(0, bandY, 0), fit(bandR * 3.4, Math.max(bandH * 1.8, bandR * 3)), new THREE.Vector3(-0.12, 0.18, 1).normalize()),
  bowl: () => closeOn(new THREE.Vector3(0, BULB.y, 0), fit(BULB.r * 2.6, BULB.r * 2.6), new THREE.Vector3(0.1, 0.25, 1).normalize()),
};
bar.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'zIn') dolly(0.6);
  else if (b.id === 'zOut') dolly(1.6);
  else if (b.id === 'zReset') home();
  else if (b.dataset.spot) { SPOTS[b.dataset.spot](); setOn(b); }
});

// --- double-tap / double-click: fly in to that point, keep tapping to go closer, at the closest it backs out
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = [];
piece.traverse((o) => { if (o.isMesh && !(o.material && o.material.isShaderMaterial)) pickables.push(o); });
function zoomAt(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  setOn(null);
  if (!hit) { home(); return; }
  const d = dist();
  const first = fit(10, 10), last = fit(2.5, 2.5);
  if (d > first * 1.2) closeOn(hit.point, first);
  else if (d > last * 1.15) closeOn(hit.point, Math.max(last, d * 0.45));
  else home();
}
let lastTap = null, down = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { if (e.isPrimary) down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
el.addEventListener('pointerup', (e) => {
  if (!e.isPrimary || !down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), held = performance.now() - down.t;
  down = null;
  if (moved > 12 || held > 350) { lastTap = null; return; }
  const now = performance.now();
  if (lastTap && now - lastTap.t < 340 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { lastTap = null; zoomAt(e.clientX, e.clientY); }
  else lastTap = { x: e.clientX, y: e.clientY, t: now };
});
el.addEventListener('dblclick', (e) => e.preventDefault());

// keep marbles crisp up close: render at full device resolution when zoomed in
let pr = 0;
function sharpen() {
  const want = Math.min(devicePixelRatio, dist() < fit(12, 12) ? 3 : 2);
  if (want !== pr) { pr = want; renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); }
}

window.__view = (az, d, ty = TY, el = 5) => { controls.autoRotate = false; tween = null; d = d || homeD(); const a = THREE.MathUtils.degToRad(az); camera.position.set(Math.sin(a) * d, ty + el, Math.cos(a) * d); controls.target.set(0, ty, 0); controls.update(); };
window.__spot = (k) => SPOTS[k]();
window.__zoomAt = zoomAt;
window.__busy = () => !!tween;

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fitHome(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop((now) => { stepTween(now); controls.update(); sharpen(); renderer.render(scene, camera); });
window.__ready = true;
</script></body></html>
