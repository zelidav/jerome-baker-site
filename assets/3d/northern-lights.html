<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northern Lights 3D</title>
<style>
:root{--bg-top:#f4f4f6;--bg-bottom:#cfd0d6;--text:#1d1d22;--muted:#5d5d66}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg-top:#3a3a40;--bg-bottom:#141418;--text:#ececf0;--muted:#a3a3ad}}
:root[data-theme="dark"]{--bg-top:#3a3a40;--bg-bottom:#141418;--text:#ececf0;--muted:#a3a3ad}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg-bottom);background-image:radial-gradient(ellipse at 50% 35%,var(--bg-top) 0%,var(--bg-bottom) 80%);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:absolute;top:0;left:0;right:0;padding:14px 16px 0;text-align:center;pointer-events:none;z-index:2}
h1{margin:0;font-size:1.15rem;font-weight:650}
p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.16);z-index:3;max-width:calc(100vw - 24px)}
.bar button{font:600 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border:0;border-radius:999px;background:#fff;color:#1d1d22;min-width:44px;height:44px;padding:0 14px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);white-space:nowrap}
.bar button.ic{padding:0;font-size:20px}
.bar button.on{background:#233671;color:#fff;box-shadow:none}
.bar .sep{width:1px;height:26px;background:rgba(0,0,0,.14);margin:0 2px}
@media (max-width:420px){.bar{gap:4px;padding:5px}.bar button{padding:0 10px;font-size:13px;height:42px}.bar button.ic{min-width:40px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar{background:rgba(30,30,36,.82)}:root:not([data-theme="light"]) .bar button{background:#2b2b33;color:#ececf0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}:root:not([data-theme="light"]) .bar button.on{background:#FCD804;color:#111}:root:not([data-theme="light"]) .bar .sep{background:rgba(255,255,255,.18)}}
</style>

<header><h1>Northern Lights, LE (3D test)</h1><p>Double-tap to zoom in, pinch to get closer.</p></header>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CROWN = document.currentScript?.dataset.crown || window.CROWN_TEX;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// units: cm. LE: 45mm tube, ~39cm tall, ~12cm bulb
const R = 2.25, BULB = 6.1, TUBE_TOP = 39, BULB_Y = BULB * 0.86;
const piece = new THREE.Group(); scene.add(piece);

// clear glass: mostly see-through with strong reflections (works over the page background)
const glass = (o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({
  color: 0xffffff, metalness: 0, roughness: 0.03, transparent: true, opacity: 0.2, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.02, specularIntensity: 1, envMapIntensity: 1.8, side: THREE.DoubleSide }, o));

// fumed gradient (gold at the bottom of the bulb, silver-blue up top, gold wisp at the tube base)
function gradTex(stops, w = 8, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), lg = g.createLinearGradient(0, 0, 0, h);
  stops.forEach(([p, col]) => lg.addColorStop(p, col));
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// tube: lathe profile with lip
const tubePts = [];
const tb = BULB_Y + BULB * 0.72;
tubePts.push(new THREE.Vector2(R * 0.9, tb - 1.5));
for (let i = 0; i <= 40; i++) { const y = tb - 1.5 + (TUBE_TOP - tb + 1.5) * i / 40; tubePts.push(new THREE.Vector2(R, y)); }
tubePts.push(new THREE.Vector2(R * 0.88, TUBE_TOP + 0.15));
const tubeGeo = new THREE.LatheGeometry(tubePts, 96);
const tubeMat = glass({ map: gradTex([[0, '#f4f8ff'], [0.55, '#f4f8ff'], [0.74, '#f2cf55'], [0.86, '#8fd3c8'], [1, '#e9c24a']]), opacity: 0.3 });
const tube = new THREE.Mesh(tubeGeo, tubeMat); piece.add(tube);
// glass edges: a slightly larger back-face shell gives the walls a visible rim, like light catching thick glass
const edge = (geo, s, col, op) => {
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
    uniforms: { c: { value: new THREE.Color(col) }, k: { value: op } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform vec3 c; uniform float k; varying vec3 vN; varying vec3 vV; void main(){ float r = 1. - abs(dot(normalize(vN), normalize(vV))); gl_FragColor = vec4(c, k * pow(r, 2.6)); }' });
  const m = new THREE.Mesh(geo, mat); m.scale.setScalar(s); return m; };
{ const e = edge(tubeGeo, 1, 0x3c4658, 0.85); e.scale.set(1.01, 1, 1.01); piece.add(e); }

// crown wrap (photo texture, wrapped round the top 7cm)
const crownH = 7.2;
const crownTex = new THREE.TextureLoader().load(CROWN, (t) => { t.colorSpace = THREE.SRGBColorSpace; });
crownTex.wrapS = THREE.RepeatWrapping;
const crown = new THREE.Mesh(
  new THREE.CylinderGeometry(R * 1.035, R * 1.04, crownH, 96, 1, true),
  new THREE.MeshPhysicalMaterial({ map: crownTex, roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.3 }));
crown.position.y = TUBE_TOP - crownH / 2; piece.add(crown);
// lip ring
const lip = new THREE.Mesh(new THREE.TorusGeometry(R * 0.98, 0.16, 16, 96), glass({ color: 0xeaf3ff }));
lip.rotation.x = Math.PI / 2; lip.position.y = TUBE_TOP + 0.05; piece.add(lip);

// ring of cobalt dots under the crown
const dotMat = new THREE.MeshPhysicalMaterial({ color: 0x1b2fa8, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6 });
const dotY = TUBE_TOP - crownH - 0.42, ND = 12;
for (let i = 0; i < ND; i++) {
  const a = i / ND * Math.PI * 2;
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.46, 48, 32), dotMat);
  d.scale.set(1, 1, 0.82);
  d.position.set(Math.cos(a) * (R + 0.18), dotY, Math.sin(a) * (R + 0.18));
  d.lookAt(0, dotY, 0); piece.add(d);
}

// dichroic crushed-opal button marbles: procedural confetti so every flake stays sharp at any zoom
function confetti(seed) {
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const bg = g.createRadialGradient(S * .45, S * .4, 10, S / 2, S / 2, S * .6);
  bg.addColorStop(0, '#e6def4'); bg.addColorStop(1, '#7f74ad'); g.fillStyle = bg; g.fillRect(0, 0, S, S);
  const cols = ['#4a2c92', '#6d43d6', '#2f5fd9', '#1f9e66', '#7fdc6a', '#cfc6ea', '#ffffff', '#b04fbf', '#1c1c55', '#e2b84a', '#3fc6d8'];
  for (let i = 0; i < 4200; i++) {
    g.fillStyle = cols[(rnd() * cols.length) | 0]; g.globalAlpha = 0.8 + rnd() * 0.2;
    const x = rnd() * S, y = rnd() * S, r = 4 + rnd() * 20;
    g.beginPath(); const n = 3 + (rnd() * 4 | 0);
    for (let k = 0; k < n; k++) { const a = k / n * 6.283 + rnd(); g.lineTo(x + Math.cos(a) * r * (0.5 + rnd()), y + Math.sin(a) * r * (0.5 + rnd())); }
    g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const marbleMats = [11, 23, 37].map((sd) => new THREE.MeshPhysicalMaterial({
  map: confetti(sd), roughness: 0.08, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.01,
  iridescence: 0.85, iridescenceIOR: 1.6, iridescenceThicknessRange: [180, 620], sheen: 0.3, sheenColor: 0xc9b8ff }));
// [height above tube base, angle around (deg, 0 = front), diameter cm]
const MARB = [];
const MARBLES = [[1.6, -38, 2.0], [1.5, 36, 2.1], [3.5, -8, 1.9], [4.1, -62, 1.8], [5.6, 12, 2.0], [3.0, 70, 1.7]];
for (const [h, deg, dia] of MARBLES) {
  const a = THREE.MathUtils.degToRad(deg - 90);
  const m = new THREE.Mesh(new THREE.SphereGeometry(dia / 2, 64, 48), marbleMats[(h * 10 | 0) % 3]);
  m.scale.set(1, 1, 0.45); // flattened button, face out
  const y = tb + h;
  m.position.set(Math.cos(a) * (R + dia * 0.18), y, Math.sin(a) * (R + dia * 0.18));
  m.lookAt(Math.cos(a) * 20, y, Math.sin(a) * 20);
  m.castShadow = true; piece.add(m); MARB.push(m.position.clone());
  { const e = edge(m.geometry, 1, 0x22203a, 0.9); e.scale.copy(m.scale).multiplyScalar(1.01); e.position.copy(m.position); e.quaternion.copy(m.quaternion); piece.add(e); }
  // clear glass collar so the marble reads as worked onto the tube
  const col = new THREE.Mesh(new THREE.TorusGeometry(dia / 2 * 0.98, 0.13, 12, 48), glass({ color: 0xf7f0c8 }));
  col.position.copy(m.position).multiplyScalar(0.985); col.position.y = y; col.lookAt(Math.cos(a) * 20, y, Math.sin(a) * 20); piece.add(col);
}
// clear pinched horn on the left (the loop in the photo)
const horn = new THREE.Mesh(new THREE.CapsuleGeometry(0.75, 1.6, 12, 32), glass({ color: 0xf4eefc }));
{ const a = THREE.MathUtils.degToRad(-115 - 90); horn.position.set(Math.cos(a) * (R + 1.1), tb + 3.2, Math.sin(a) * (R + 1.1)); horn.rotation.z = 0.35; piece.add(horn); }

// fumed bulb
const bulbPts = [];
for (let i = 0; i <= 64; i++) {
  const t = -Math.PI / 2 + Math.PI * i / 64, r = Math.cos(t) * BULB, y = BULB_Y + Math.sin(t) * BULB * 0.86;
  bulbPts.push(new THREE.Vector2(Math.max(r, i > 56 ? R * 0.95 : r), y));
}
const bulbMat = glass({
  map: gradTex([[0, '#e8f6f6'], [0.2, '#9fd9e8'], [0.42, '#78c3d8'], [0.62, '#d9e39a'], [0.82, '#efc24a'], [1, '#f2c64e']]),
  opacity: 0.8 });
const bulb = new THREE.Mesh(new THREE.LatheGeometry(bulbPts, 128), bulbMat);
bulb.castShadow = true; piece.add(bulb);
{ const e = edge(bulb.geometry, 1, 0x3c4658, 0.75); e.scale.set(1.005, 1.003, 1.005); piece.add(e); }
// flat foot
const foot = new THREE.Mesh(new THREE.CylinderGeometry(BULB * 0.42, BULB * 0.42, 0.05, 64), glass({ color: 0xf7e6a0 }));
foot.position.y = 0.04; piece.add(foot);

// downstem + light-blue joint + bowl
const stemDir = new THREE.Vector3(Math.cos(THREE.MathUtils.degToRad(-90 + 0)) , 0, 0);
const stem = new THREE.Group(); piece.add(stem);
stem.position.set(BULB * 0.55, BULB_Y + BULB * 0.25, BULB * 0.35);
stem.rotation.z = -Math.PI / 4.2; stem.rotation.y = -0.55;
const st = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 7.5, 48, 1, true), glass({ color: 0xf2f7ff }));
st.position.y = -1.5; stem.add(st);
const joint = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.82, 1.8, 48), new THREE.MeshPhysicalMaterial({ color: 0x6fd3ea, roughness: 0.2, clearcoat: 1 }));
joint.position.y = 2.1; stem.add(joint);
const bowlPts = [new THREE.Vector2(0.55, 0), new THREE.Vector2(0.9, 0.25), new THREE.Vector2(1.6, 1.4), new THREE.Vector2(1.75, 2.1), new THREE.Vector2(1.6, 2.2), new THREE.Vector2(1.45, 1.6), new THREE.Vector2(0.8, 0.4)];
const bowlMat = new THREE.MeshPhysicalMaterial({ map: crownTex, roughness: 0.1, clearcoat: 1, side: THREE.DoubleSide });
const bowl = new THREE.Mesh(new THREE.LatheGeometry(bowlPts, 64), bowlMat); bowl.position.y = 2.9; stem.add(bowl);

// floor shadow
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(12, 40, 18); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15 }); scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 0.6));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 500);
const HOME = { pos: new THREE.Vector3(0, 24, 92), tgt: new THREE.Vector3(0, 19, 0) };
const fitHome = () => {};
fitHome();
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.tgt); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 1.2;
controls.minDistance = 2.2; controls.maxDistance = 170;
controls.zoomToCursor = true; controls.zoomSpeed = 1.1; controls.screenSpacePanning = true;
let tween = null;
controls.addEventListener('start', () => { controls.autoRotate = false; tween = null; });

// --- smooth camera moves
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function flyTo(pos, tgt, ms = 900) {
  controls.autoRotate = false;
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: tgt.clone(), start: performance.now(), ms };
}
function stepTween(now) {
  if (!tween) return;
  const k = Math.min(1, (now - tween.start) / tween.ms), e = ease(k);
  camera.position.lerpVectors(tween.p0, tween.p1, e);
  controls.target.lerpVectors(tween.t0, tween.t1, e);
  if (k >= 1) tween = null;
}
// look at a point from a direction (default: the side we're already on), at a given distance
function closeOn(point, d, from) {
  const dir = (from ? from.clone() : camera.position.clone().sub(point)).normalize();
  flyTo(point.clone().add(dir.multiplyScalar(d)), point);
}
// distance at which a w x h cm patch fills the screen (narrow phones are limited by width)
function fit(w, h) {
  const v = THREE.MathUtils.degToRad(camera.fov) / 2, hz = Math.atan(Math.tan(v) * camera.aspect);
  return 1.08 * Math.max(h / 2 / Math.tan(v), w / 2 / Math.tan(hz));
}
const dist = () => camera.position.distanceTo(controls.target);
function dolly(f) {
  const d = THREE.MathUtils.clamp(dist() * f, controls.minDistance, controls.maxDistance);
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(controls.target.clone().add(dir.multiplyScalar(d)), controls.target.clone(), 450);
}
const bar = document.querySelector('.bar');
function setOn(b) { bar.querySelectorAll('[data-spot]').forEach((x) => x.classList.toggle('on', x === b)); }
const home = () => { fitHome(); flyTo(HOME.pos, HOME.tgt); setOn(null); };

// --- detail spots
scene.updateMatrixWorld(true);
const mc = MARB.reduce((a, v) => a.add(v), new THREE.Vector3()).divideScalar(MARB.length);
const mOut = new THREE.Vector3(mc.x, 0, mc.z).normalize();
const bowlAt = new THREE.Vector3(); bowl.getWorldPosition(bowlAt);
const SPOTS = {
  marbles: () => closeOn(mc.clone().add(new THREE.Vector3(0, 0.4, 0)), fit(9, 7.5), mOut.clone().add(new THREE.Vector3(0, 0.12, 0))),
  crown: () => {
    const t = new THREE.Vector3(0, TUBE_TOP - crownH / 2 - 0.6, 0);
    const s = camera.position.clone().sub(t); s.y = 0; if (s.lengthSq() < 1e-4) s.set(0, 0, 1);
    closeOn(t, fit(6.5, 9.5), s.normalize().add(new THREE.Vector3(0, 0.22, 0)));
  },
  bowl: () => closeOn(bowlAt.clone().add(new THREE.Vector3(0, 1.1, 0)), fit(6.5, 6.5), new THREE.Vector3(0.85, 0.28, 0.75)),
};
bar.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'zIn') dolly(0.6);
  else if (b.id === 'zOut') dolly(1.6);
  else if (b.id === 'zReset') home();
  else if (b.dataset.spot) { SPOTS[b.dataset.spot](); setOn(b); }
});

// --- double-tap / double-click: fly in to that point, keep tapping to go closer, at the closest it backs out
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = [];
piece.traverse((o) => { if (o.isMesh && !(o.material && o.material.isShaderMaterial)) pickables.push(o); });
function zoomAt(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  setOn(null);
  if (!hit) { home(); return; }
  const d = dist();
  const first = fit(7, 7), last = fit(1.8, 1.8);
  if (d > first * 1.2) closeOn(hit.point, first);
  else if (d > last * 1.15) closeOn(hit.point, Math.max(last, d * 0.45));
  else home();
}
let lastTap = null, down = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { if (e.isPrimary) down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
el.addEventListener('pointerup', (e) => {
  if (!e.isPrimary || !down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), held = performance.now() - down.t;
  down = null;
  if (moved > 12 || held > 350) { lastTap = null; return; }
  const now = performance.now();
  if (lastTap && now - lastTap.t < 340 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { lastTap = null; zoomAt(e.clientX, e.clientY); }
  else lastTap = { x: e.clientX, y: e.clientY, t: now };
});
el.addEventListener('dblclick', (e) => e.preventDefault());

// keep marbles crisp up close: render at full device resolution when zoomed in
let pr = 0;
function sharpen() {
  const want = Math.min(devicePixelRatio, dist() < fit(14, 14) ? 3 : 2);
  if (want !== pr) { pr = want; renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); }
}

window.__view = (az, d = 92, ty = 19) => { controls.autoRotate = false; tween = null; const a = THREE.MathUtils.degToRad(az); camera.position.set(Math.sin(a) * d, ty + 5, Math.cos(a) * d); controls.target.set(0, ty, 0); controls.update(); };
window.__spot = (k) => SPOTS[k]();
window.__zoomAt = zoomAt;
window.__busy = () => !!tween;

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fitHome(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop((now) => { stepTween(now); controls.update(); sharpen(); renderer.render(scene, camera); });
window.__ready = true;
</script></body></html>
