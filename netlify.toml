# Netlify config for the new Jerome Baker site. See netlify/README.md.
[build]
  command = "bash netlify/build.sh"
  publish = "dist"

[build.environment]
  MODE = "lander"
  OLD_HOST = "jeromebaker.com"

# previews and branch deploys test the cutover build; production stays the lander until DNS moves
[context.deploy-preview.environment]
  MODE = "cutover"

[context.branch-deploy.environment]
  MODE = "cutover"
